name: Build Stream Notify test DLL (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure OBS and plugin
        run: cmake --preset windows-ci-x64
      - name: Build Windows x64 DLL
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel
      - name: Test thresholds and currency conversion
        run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - name: Exercise and render Qt dock
        shell: pwsh
        run: |
          $qtRoot = Join-Path $PWD ".deps/obs-deps-qt6-2026-10-23-x64"
          $env:PATH = "$qtRoot/bin;$PWD/build_x64/qtwebsockets-install/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot/plugins"
          $env:STREAM_NOTIFY_PREVIEW_DIR = "$PWD/build_x64/ui-preview-config"
          & ./build_x64/RelWithDebInfo/stream-notify-ui-preview.exe ui-previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: StreamNotify-UI-Previews
          path: ui-previews/
          if-no-files-found: error
      - name: Include UI preview diagnostics
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($item in Get-ChildItem -Path ui-previews -File -Filter *.png) {
            $source = [System.Drawing.Image]::FromFile($item.FullName)
            $ratio = [Math]::Min(1.0, [Math]::Min(700.0 / $source.Width, 1000.0 / $source.Height))
            $bitmap = [System.Drawing.Bitmap]::new([int]($source.Width * $ratio), [int]($source.Height * $ratio))
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.DrawImage($source, 0, 0, $bitmap.Width, $bitmap.Height)
            $stream = [System.IO.MemoryStream]::new()
            $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $encoded = [Convert]::ToBase64String($stream.ToArray())
            Write-Output ("UI_PREVIEW_BEGIN:" + $item.Name)
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 1000) {
              Write-Output ("UI_PREVIEW_DATA:" + $encoded.Substring($offset, [Math]::Min(1000, $encoded.Length - $offset)))
            }
            Write-Output "UI_PREVIEW_END"
            $stream.Dispose()
            $graphics.Dispose()
            $bitmap.Dispose()
            $source.Dispose()
          }
      - name: Stage plugin
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item docs/TEST_WINDOWS_RU.md package/INSTALL_RU.md
          if (!(Test-Path package/stream-notify/bin/64bit/stream-notify.dll)) { throw "Plugin DLL missing" }
          if (!(Test-Path package/stream-notify/data/qt-plugins/tls/qschannelbackend.dll)) { throw "TLS backend missing" }
          Get-ChildItem package/stream-notify -Recurse -Filter *.dll | Get-FileHash | Format-Table -AutoSize | Out-File package/SHA256.txt
      - name: Verify packaged TLS and Telegram HTTPS without credentials
        shell: pwsh
        run: |
          $qtRoot = Join-Path $PWD ".deps/obs-deps-qt6-2026-10-23-x64"
          $env:PATH = "$qtRoot/bin;$env:PATH"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          & ./build_x64/RelWithDebInfo/stream-notify-tls-test.exe "$PWD/package/stream-notify/data/qt-plugins"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: StreamNotify-Test-DLL-OBS33-Windows-x64
          path: package/
          if-no-files-found: error
