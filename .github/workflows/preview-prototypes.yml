name: Preview design prototypes
on:
  push:
    paths:
      - '*.png'
      - '.github/workflows/preview-prototypes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render prototype previews
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($item in Get-ChildItem -File -Filter *.png) {
            $source = [System.Drawing.Image]::FromFile($item.FullName)
            $ratio = [Math]::Min(1.0, [Math]::Min(700.0 / $source.Width, 1000.0 / $source.Height))
            $bitmap = [System.Drawing.Bitmap]::new([int]($source.Width * $ratio), [int]($source.Height * $ratio))
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.DrawImage($source, 0, 0, $bitmap.Width, $bitmap.Height)
            $stream = [System.IO.MemoryStream]::new()
            $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $encoded = [Convert]::ToBase64String($stream.ToArray())
            Write-Output ("PROTOTYPE_BEGIN:" + $item.Name)
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 1000) {
              Write-Output ("PROTOTYPE_DATA:" + $encoded.Substring($offset, [Math]::Min(1000, $encoded.Length - $offset)))
            }
            Write-Output "PROTOTYPE_END"
            $stream.Dispose()
            $graphics.Dispose()
            $bitmap.Dispose()
            $source.Dispose()
          }
